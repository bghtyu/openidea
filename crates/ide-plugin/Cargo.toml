[package]
name = "ide-plugin"
description = "Sandboxed WebAssembly plugin host (wasmtime component model + WASI preview 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
ide-language.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
quick-xml = "0.42"
wasmtime = { version = "49.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
